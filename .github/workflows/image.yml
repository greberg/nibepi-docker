# Builds the image from this repo plus the code repositories, and publishes it
# to GHCR as ghcr.io/<owner>/nibepi-nodered for amd64 and arm64 (Raspberry Pi
# with a 64-bit OS), so the Pi can pull instead of building.
#
# The code repositories are checked out from the same owner as this repo, on
# CODE_REF. A change pushed there is picked up by the nightly run, or start
# one by hand under Actions -> image -> Run workflow.
name: image

on:
  push:
    branches: [master, improvements]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      code_ref:
        description: Branch of nibepi-backend and node-red-contrib-nibepi to build
        default: improvements

env:
  CODE_REF: ${{ inputs.code_ref || 'improvements' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/nibepi-nodered

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out nibepi-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nibepi-backend
          ref: ${{ env.CODE_REF }}
          path: nibepi

      - name: Check out node-red-contrib-nibepi
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/node-red-contrib-nibepi
          ref: ${{ env.CODE_REF }}
          path: node-red-contrib-nibepi

      - name: Date tag
        id: date
        run: echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push unless this is a pull request)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
