# Builds the gateway image from this repo plus nibepi-backend, and publishes
# it to GHCR as ghcr.io/<owner>/nibepi-gateway for amd64 and arm64 (Raspberry
# Pi with a 64-bit OS), so the Pi can pull instead of building.
#
# nibepi-backend is checked out from the same owner as this repo, on
# CODE_REF. A change pushed there is picked up by the nightly run, or start
# one by hand under Actions -> image -> Run workflow.
#
# The Node-RED image this replaced, ghcr.io/<owner>/nibepi-nodered, is no
# longer built; its last tags stay in GHCR as an archive (see the
# nodered-final tag of this repo).
name: image

on:
  push:
    branches: [improvements]
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      code_ref:
        description: Branch of nibepi-backend to build
        default: improvements

env:
  CODE_REF: ${{ inputs.code_ref || 'improvements' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/nibepi-gateway

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # As nibepi/, the sibling checkout the Dockerfile's backend stage copies.
      - name: Check out nibepi-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/nibepi-backend
          ref: ${{ env.CODE_REF }}
          path: nibepi

      # YYYYMMDD and sha-<short> stay put when the nightly run moves :latest,
      # so a docker-compose.yml can pin either (image: ...:20261010).
      - name: Date and commit tags
        id: date
        run: |
          echo "tag=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "backend=$(git -C nibepi rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$(date -u +%Y%m%d)-$(git -C nibepi rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.date.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.date.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            nibepi.backend.revision=${{ steps.date.outputs.backend }}
          build-args: |
            NIBEPI_BUILD=${{ steps.date.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
