# NibePi gateway: talks to a Nibe heat pump over RS485 (or NibeGW) and
# connects out to an MQTT broker. This file is the whole configuration.
#
# Copy it to the Pi, e.g. ~/nibepi/docker-compose.yml, fill in the MQTT
# settings below, and run from that directory:
#   docker compose pull      fetch the image named below
#   docker compose up -d     start, or apply an edit / a newly pulled image
#   docker compose logs -f   follow the log
# Nothing is built here: the image comes from GHCR (GitHub Actions) or from
# a separate local build (the NibePi workspace's scripts/build.sh).
#
# Your copy holds the MQTT password. Keep it on the Pi (chmod 600) and don't
# commit a filled-in copy anywhere.
#
# Before the first start: mkdir config && sudo chown 1000:1000 config
# (the gateway runs as uid 1000). Coming from Node-RED, copy its
# /etc/nibepi/config.json into config/ first.
#
# Kept identical in nibepi-docker (docker-compose.yml) and the NibePi
# workspace (docker/docker-compose.yml).
services:
  nibepi-gateway:
    # :latest follows the newest build (every push and nightly). Pin a build
    # for reproducibility: a date (:20261010) or a commit (:sha-1a2b3c4).
    # A local scripts/build.sh image is :local. To roll back, use :previous
    # (the image that ran before the last scripts/deploy.sh or pi/install.sh)
    # or an earlier date tag, then docker compose up -d.
    image: ghcr.io/greberg/nibepi-gateway:latest
    container_name: nibepi-gateway
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM and reaps the backend's shell children.
    init: true
    # Values are single-quoted: inside quotes write ' as '' and $ as $$
    # (compose would substitute a single $). An empty value counts as unset,
    # and these override config.json without being written to it.
    environment:
      # The broker, usually the Mosquitto add-on on the Home Assistant
      # machine: its LAN address (127.0.0.1 would be the container itself).
      # Without a host the gateway runs with MQTT off.
      NIBEPI_MQTT_HOST: ''              # e.g. 192.168.1.10
      NIBEPI_MQTT_PORT: '1883'
      NIBEPI_MQTT_USER: ''              # e.g. nibepi, a Home Assistant user
      NIBEPI_MQTT_PASS: ''
      NIBEPI_MQTT_TOPIC: 'nibe/modbus/'
      # serial (RS485 HAT, devices below) or nibegw.
      NIBEPI_CONNECTION: 'serial'
      # The serial port inside the container; devices below maps the host's.
      NIBEPI_SERIAL_PORT: '/dev/ttyAMA0'
      # NibeGW only: the NibeGW / esphome-nibe device, and the local UDP port
      # it sends to (default 9999, see ports below).
      NIBEPI_NIBEGW_HOST: ''
      NIBEPI_NIBEGW_PORT: ''
      # What a plain <reg>/set may write: all, none or a comma list of
      # registers. Set none once the Home Assistant component is in use.
      NIBEPI_RAW_SET: 'all'
      # error, warn, info, debug or trace (every raw bus frame).
      NIBEPI_LOG_LEVEL: 'info'
      # The read-only status page, http://<pi>:8080/. Empty turns it off;
      # another port here needs the same port on the right in ports: below.
      NIBEPI_UI_PORT: '8080'
      # Optional HTTP Basic auth for the page: set both, or leave both empty.
      NIBEPI_UI_USER: ''
      NIBEPI_UI_PASS: ''
      TZ: 'Europe/Stockholm'
    # The RS485 HAT on the Pi's GPIO UART. /dev/serial0 is its stable alias
    # (needs enable_uart=1, and dtoverlay=disable-bt on a Pi 3/4, in
    # /boot/firmware/config.txt); it is /dev/ttyAMA0 inside the container.
    # NibeGW users: remove devices and group_add, and uncomment ports.
    devices:
      - /dev/serial0:/dev/ttyAMA0
    # The device node keeps the host's group. "dialout" is gid 20 in the
    # image, as on Raspberry Pi OS; if the host's differs
    # (getent group dialout | cut -d: -f3), put that number here.
    group_add:
      - dialout
    ports:
      # The status page. Change the host port (left) or remove the line to
      # disable it. LAN only - don't expose it to the internet.
      - "8080:8080"
      # NibeGW only: it sends its frames to this host on UDP 9999.
      # - "9999:9999/udp"
    volumes:
      - ./config:/etc/nibepi   # config.json (+ .bak), lease baselines
    # The healthcheck is built into the image: healthy once the pump has
    # answered in the last 10 minutes (docker ps shows it).
    # Docker's default json-file log never rotates and fills the SD card.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
